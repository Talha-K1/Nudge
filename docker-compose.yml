
services:
  postgres:
    image: postgres:17
    container_name: nudge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nudge
      POSTGRES_USER: nudge
      POSTGRES_PASSWORD: nudge_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nudge -d nudge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
